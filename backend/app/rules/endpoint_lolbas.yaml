id: RULE-EDR-002
name: LOLBAS Execution / Reverse Shell Spawned
description: Detects execution of obfuscated PowerShell, download cradles, or reverse shells on monitored endpoints.
severity: high
mitre_attack_id: T1059.001
window_seconds: 60
threshold: 1
match:
  event_type: endpoint_finding
  patterns:
    - "(?i)(RULE-EDR-PS|RULE-EDR-REV|RULE-EDR-CRADLE|RULE-EDR-PRIV|T1059|T1105|T1548)"
group_by:
  - source_ip

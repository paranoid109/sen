services:
  db:
    image: postgres:16-alpine
    container_name: sentinelx_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinelx_db
      POSTGRES_USER: sentinelx_user
      POSTGRES_PASSWORD: sentinelx_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelx_user -d sentinelx_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelx_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelx_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: SentinelX
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://sentinelx_user:sentinelx_secret_password@db:5432/sentinelx_db
      JWT_SECRET: super_secret_production_jwt_key_sentinelx_32chars
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 480
      INGEST_API_KEY: sen_ingest_demo_key
      CORS_ORIGINS: '["http://localhost:5173", "http://127.0.0.1:5173"]'
      RATE_LIMIT_LOGIN_ATTEMPTS: 5
      RATE_LIMIT_LOGIN_WINDOW_SECONDS: 900
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - sentinelx_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelx_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    networks:
      - sentinelx_net

volumes:
  postgres_data:
    driver: local

networks:
  sentinelx_net:
    driver: bridge
